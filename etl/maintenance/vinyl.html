<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Music Companion — Vinyl</title>
<link rel="stylesheet" href="shared.css" />
<style>
  main.wide { max-width: 1400px; }

  /* Health strip: one tile per check, click to filter to the records failing it. */
  .health { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin-bottom: 18px; padding: 0; }
  .health .tile { padding: 12px 14px; border-right: 1px solid var(--edge); cursor: pointer; background: none; border-top: none; border-bottom: none; border-left: none; border-radius: 0; text-align: left; }
  .health .tile:last-child { border-right: none; }
  .health .tile:hover { background: var(--accent-wash); }
  .health .tile[aria-pressed="true"] { background: var(--accent-wash); box-shadow: inset 0 -2px 0 var(--accent); }
  .health .t-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
  .health .t-num { font-family: var(--font-mono); font-size: 1.15rem; color: var(--text); }
  .health .t-num small { font-size: 0.72rem; color: var(--text-muted); }
  .health .t-bar { height: 3px; background: var(--surface-3); margin-top: 6px; border-radius: 2px; overflow: hidden; }
  .health .t-bar i { display: block; height: 100%; background: var(--ok); }
  .health .t-todo { font-size: 0.72rem; color: var(--warn); }

  .vtools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .vtools .search { flex: 1; min-width: 220px; }
  .vtools .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #bulk-panel .block-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 14px; background: var(--bg-2); border-bottom: 1px solid var(--edge); }
  #bulk-panel table td { padding: 6px 8px; font-size: 0.84rem; }

  /* Grid of records */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .rec { position: relative; background: var(--surface-2); border: 1px solid var(--edge); border-radius: var(--radius-sm); cursor: pointer; overflow: hidden; transition: border-color .15s var(--ease), transform .15s var(--ease); }
  .rec:hover { border-color: var(--edge-strong); transform: translateY(-1px); }
  .rec.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .rec .art { aspect-ratio: 1; background: var(--surface); display: grid; place-items: center; overflow: hidden; }
  .rec .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rec .body { padding: 9px 11px 10px; }
  .rec .r-title { font-weight: 600; font-size: 0.9rem; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .rec .r-press { font-size: 0.76rem; color: var(--accent-vinyl); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec .r-artist { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec .r-years { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; }
  .rec .r-years .warn-text { color: var(--warn); }
  .pips { display: flex; gap: 3px; margin-top: 8px; }
  .pip { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); }
  .pip.ok { background: var(--ok); } .pip.warn { background: var(--warn); } .pip.bad { background: var(--bad); } .pip.unknown { background: var(--silver-dim); opacity: 0.5; }
  .pip.na { background: rgba(52, 211, 153, 0.35); }
  .rec .flag { position: absolute; top: 8px; right: 8px; }
  .rec .flag .badge { background: rgba(7, 6, 10, 0.85); }
  .placeholder-art { width: 62%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--surface-3) 0 14%, #050408 15% 17%, #111 18% 100%); box-shadow: inset 0 0 0 1px var(--edge), inset 0 0 0 8px #0b0b0f, inset 0 0 0 9px var(--edge); }
  .grid-empty { grid-column: 1 / -1; }

  /* Drawer */
  #drawer { position: fixed; top: 53px; right: 0; bottom: 0; width: min(720px, 100vw); z-index: 30; display: flex; flex-direction: column;
            background: var(--surface-2); border-left: 1px solid var(--edge-strong); box-shadow: -18px 0 40px rgba(0, 0, 0, 0.55); transform: translateX(105%); transition: transform .2s var(--ease); }
  #drawer.open { transform: none; }
  .d-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--surface-3); border-bottom: 1px solid var(--edge); }
  .d-bar .pos { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-dim); }
  .d-body { flex: 1; overflow-y: auto; padding: 16px 18px 40px; }
  .d-head { display: grid; grid-template-columns: 150px 1fr; gap: 16px; margin-bottom: 14px; }
  .d-head .cover { width: 150px; height: 150px; object-fit: cover; border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface); display: grid; place-items: center; }
  .d-head h2 { font-size: 1.15rem; text-transform: none; letter-spacing: 0; margin: 0 0 2px; }
  .d-head .credits { font-size: 0.9rem; }
  .d-head .facts { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; font-size: 0.82rem; }
  .sec { border: 1px solid var(--edge); border-radius: var(--radius-sm); background: var(--surface); margin-top: 12px; overflow: hidden; }
  .sec > .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; background: var(--bg-2); border-bottom: 1px solid var(--edge); }
  .sec > .sec-head h3 { margin: 0; }
  .sec > .sec-body { padding: 10px 12px; font-size: 0.86rem; }
  .checklist { list-style: none; margin: 0; padding: 0; }
  .checklist li { display: grid; grid-template-columns: 18px 130px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--edge); }
  .checklist li:last-child { border-bottom: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.unknown { background: var(--silver-dim); }
  .dot.na { background: none; box-shadow: inset 0 0 0 2px rgba(52, 211, 153, 0.55); }
  .checklist .c-label { font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 10px; margin: 0; }
  .kv dt { color: var(--text-dim); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .kv dd { margin: 0; }
  .fmt-tags { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .badge.reissue { color: #93c5fd; border-color: rgba(147, 197, 253, 0.45); }
  .badge.colour { color: var(--accent-soft); }
  .notes { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--edge); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 0.84rem; }
  .stars { color: var(--accent-vinyl); letter-spacing: 1px; }
  .link-card { border: 1px solid var(--edge); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface-2); margin-bottom: 8px; }
  .link-card .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .inline-edit { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .inline-edit input[type="text"] { flex: 1; min-width: 220px; }
  .inline-edit input[type="number"] { width: 90px; }
  .big-cover { width: 220px; height: 220px; object-fit: cover; border: 1px solid var(--edge); border-radius: var(--radius-sm); }
  .d-body .resolve input[type="text"] { width: 240px; }
  @media (max-width: 700px) { .d-head { grid-template-columns: 1fr; } .checklist li { grid-template-columns: 18px 1fr; } .checklist li .c-text, .checklist li .c-fix { grid-column: 2; } }
  .swatch { display: inline-block; width: 16px; height: 16px; border-radius: 50%; vertical-align: middle; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .swatch.translucent { opacity: .55; }
  .palette { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .pal { display: inline-flex; gap: 5px; align-items: center; padding: 2px 8px 2px 4px; font-size: 0.74rem; border: 1px solid var(--edge); border-radius: 999px; background: var(--surface); color: var(--text); cursor: pointer; }
  .pal.on { border-color: var(--accent-vinyl); box-shadow: 0 0 0 1px var(--accent-vinyl); }
  .pal-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header id="topnav"></header>
<main class="wide">
  <h1>Vinyl</h1>
  <p class="subtitle">Every record on the shelf, fully identified: the right artist, the album as originally released (its first year and plain title — even when the copy is a 2021 reissue), and this exact pressing linked to its MusicBrainz release.</p>

  <div class="card flush health" id="health"></div>

  <div class="card" style="padding:14px 16px">
    <div class="vtools">
      <input type="search" class="search" id="q" placeholder="Filter by artist, title, label, catalogue number, notes…" />
      <div class="group">
        <label class="meta">Sort <select id="sort">
          <option value="attention">Needs attention first</option>
          <option value="artist">Artist</option>
          <option value="added">Recently added</option>
          <option value="year">Original year</option>
          <option value="title">Title</option>
        </select></label>
      </div>
      <div class="group" id="extra-filters">
        <button class="chip filter-chip" data-extra="suggestion" aria-pressed="false">Has MusicBrainz link to review</button>
        <button class="chip filter-chip" data-extra="multi" aria-pressed="false">Several pressings</button>
        <button class="chip filter-chip" data-extra="reissue" aria-pressed="false">Reissues</button>
        <button class="chip filter-chip" data-extra="notes" aria-pressed="false">Has notes</button>
      </div>
      <span class="meta" id="shown"></span>
    </div>
    <div class="vtools" style="margin-top:12px; padding-top:12px; border-top:1px solid var(--edge)">
      <div class="group">
        <label class="meta">Check <input type="number" id="sweep-limit" value="50" min="1" max="250" style="width:64px" /> records against MusicBrainz</label>
        <button class="primary small" id="sweep-btn">Check</button>
      </div>
      <span class="spacer" style="flex:1"></span>
      <div class="group">
        <button class="small" id="bulk-links">Review confirmed pressing links</button>
        <button class="small" id="bulk-years">Review original years</button>
        <button class="small" id="bulk-covers">Fetch missing covers</button>
      </div>
    </div>
    <div id="sweep-box"></div>
    <div id="bulk-panel"></div>
  </div>

  <div class="grid" id="grid"><div class="empty grid-empty">Loading…</div></div>
</main>

<aside id="drawer" aria-hidden="true">
  <div class="d-bar">
    <button class="small" id="d-prev" title="Previous (k)">‹ <kbd>k</kbd></button>
    <button class="small" id="d-next" title="Next (j)"><kbd>j</kbd> ›</button>
    <span class="pos" id="d-pos"></span>
    <span class="spacer" style="flex:1"></span>
    <a class="small btn" id="d-albums" href="#">Open in Albums</a>
    <button class="small" id="d-close" title="Close (Esc)">✕ <kbd>esc</kbd></button>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>

<script src="shared.js"></script>
<script src="album-ui.js"></script>
<script src="artist-ui.js"></script>
<script>
mountNav("Vinyl");

const CHECKS = [
  ["artist", "Artist MBID"], ["album", "Album MBID"], ["pressing", "Pressing linked"], ["identity", "Verified"],
  ["year", "Original year"], ["title", "Clean title"], ["cover", "Cover art"], ["versions", "No duplicates"],
];
let all = [];           // /api/vinyl/holdings
let shown = [];         // after filter + sort (drawer j/k walks this)
let checkFilter = null; // a CHECKS key: show records where that check isn't ok
const extra = new Set();
let openId = null;

const check = (h, key) => h.checks.find((c) => c.key === key);
const done = (c) => c.status === "ok" || c.status === "na"; // "na": nothing to do (e.g. MusicBrainz doesn't list the pressing)
const artUrl = (h) => h.album.coverStatus === "ok" ? `/covers/${h.album.albumId}.jpg` : null;
const stars = (n) => n ? `<span class="stars" title="${n}/5">${"★".repeat(n)}${"☆".repeat(5 - n)}</span>` : "";

function fmtTags(h) {
  const f = h.formatInfo;
  return `<span class="fmt-tags">${f.media ? `<span class="badge">${esc(f.media)}</span>` : ""}${f.tags.map((t) =>
    `<span class="badge ${t.kind === "reissue" ? "reissue" : t.kind === "colour" ? "colour" : t.kind === "warn" ? "warn" : ""}" title="${esc(t.code)}">${esc(t.label)}</span>`).join("")}</span>`;
}
function pressingKind(h) {
  if (h.formatInfo.reissue) return `<span class="badge reissue">Reissue${h.pressingYear ? ` ${h.pressingYear}` : ""}</span>`;
  if (h.pressingYear && h.originalYear && h.pressingYear === h.originalYear) return `<span class="badge high">Original pressing</span>`;
  return h.pressingYear ? `<span class="badge">Pressed ${h.pressingYear}</span>` : "";
}

// -- Loading + health strip ---------------------------------------------------------------------

async function load(keepOpen = true) {
  const { ok, data } = await api("/api/vinyl/holdings");
  if (!ok) { document.getElementById("grid").innerHTML = `<div class="empty grid-empty">${esc(data.message)}</div>`; return; }
  all = data.holdings;
  renderHealth(data.summary);
  render();
  updateBulkButtons();
  if (keepOpen && openId && all.some((h) => h.vinylId === openId)) openDrawer(openId, { scroll: false });
}

let lastSummary = {};
function renderHealth(summary) {
  lastSummary = summary;
  const total = all.length;
  const complete = all.filter((h) => h.checks.every(done)).length;
  const tiles = [`<button class="tile" data-check="" aria-pressed="${checkFilter === null && !extra.size}">
      <div class="t-label">Fully complete</div><div class="t-num">${complete}<small> / ${total}</small></div>
      <div class="t-bar"><i style="width:${total ? (100 * complete) / total : 0}%"></i></div></button>`];
  for (const [key, label] of CHECKS) {
    const s = summary[key] || {};
    const okN = (s.ok || 0) + (s.na || 0), todo = total - okN;
    tiles.push(`<button class="tile" data-check="${key}" aria-pressed="${checkFilter === key}" title="Show records where “${label}” isn't done">
      <div class="t-label">${label}</div><div class="t-num">${okN}<small> / ${total}</small></div>
      <div class="t-bar"><i style="width:${total ? (100 * okN) / total : 0}%"></i></div>
      <div class="t-todo">${todo ? `${todo} to do` : "&nbsp;"}</div></button>`);
  }
  const el = document.getElementById("health");
  el.innerHTML = tiles.join("");
  el.querySelectorAll(".tile").forEach((t) => t.addEventListener("click", () => {
    const k = t.dataset.check || null;
    checkFilter = checkFilter === k ? null : k;
    if (!k) { extra.clear(); document.querySelectorAll("#extra-filters .filter-chip").forEach((c) => c.setAttribute("aria-pressed", "false")); }
    renderHealth(lastSummary);
    render();
  }));
}

// -- Grid ---------------------------------------------------------------------------------------

function matches(h, q) {
  if (!q) return true;
  const hay = [h.album.title, h.rawTitle, h.artist.name, h.rawArtist, h.label, h.catalogNumber, h.notes, h.format].join(" ").toLowerCase();
  return q.split(/\s+/).every((w) => hay.includes(w));
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  shown = all.filter((h) => matches(h, q)
    && (!checkFilter || !done(check(h, checkFilter)))
    && (!extra.has("suggestion") || h.suggestions.length)
    && (!extra.has("multi") || h.otherPressings.length)
    && (!extra.has("reissue") || h.formatInfo.reissue)
    && (!extra.has("notes") || (h.notes || "").trim()));
  const by = {
    attention: (a, b) => b.score - a.score || a.artist.name.localeCompare(b.artist.name),
    artist: (a, b) => a.artist.name.localeCompare(b.artist.name) || (a.album.year || 0) - (b.album.year || 0),
    added: (a, b) => (b.dateAdded || "").localeCompare(a.dateAdded || ""),
    year: (a, b) => (a.originalYear || a.album.year || 9999) - (b.originalYear || b.album.year || 9999),
    title: (a, b) => a.album.title.localeCompare(b.album.title),
  }[sort];
  shown.sort(by);
  document.getElementById("shown").textContent = `${shown.length} of ${all.length} records`;
  const grid = document.getElementById("grid");
  if (!shown.length) { grid.innerHTML = `<div class="empty grid-empty">Nothing matches — every record passes this check.</div>`; return; }
  grid.innerHTML = shown.map((h) => {
    const art = artUrl(h);
    const yr = check(h, "year");
    const years = `${h.album.year ?? "—"}${yr.status === "warn" ? ` <span class="warn-text" title="${esc(yr.text)}">(orig. ${h.originalYear})</span>` : ""}${h.pressingYear && h.pressingYear !== (h.originalYear || h.album.year) ? ` · pressed ${h.pressingYear}` : ""}`;
    return `<div class="rec ${h.vinylId === openId ? "current" : ""}" data-id="${h.vinylId}" tabindex="0">
      <div class="art">${art ? `<img src="${art}" alt="" loading="lazy" />` : `<div class="placeholder-art"></div>`}</div>
      ${h.suggestions.length ? `<div class="flag"><span class="badge medium">MB link to review</span></div>` : ""}
      <div class="body">
        <div class="r-title">${esc(h.album.title)}</div>
        ${h.pressingTitle ? `<div class="r-press" title="This record's own title">${esc(h.pressingTitle)}</div>` : ""}
        <div class="r-artist">${esc(h.credits.map((c) => c.name).join(", "))}</div>
        <div class="r-years">${years}</div>
        <div class="pips">${h.checks.map((c) => `<span class="pip ${c.status}" title="${esc(c.label)}: ${esc(c.text)}"></span>`).join("")}</div>
      </div>
    </div>`;
  }).join("");
  grid.querySelectorAll(".rec").forEach((el) => {
    el.addEventListener("click", () => openDrawer(parseInt(el.dataset.id, 10)));
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") openDrawer(parseInt(el.dataset.id, 10)); });
  });
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
document.querySelectorAll("#extra-filters .filter-chip").forEach((b) => b.addEventListener("click", () => {
  const k = b.dataset.extra;
  extra.has(k) ? extra.delete(k) : extra.add(k);
  b.setAttribute("aria-pressed", String(extra.has(k)));
  render();
}));

// -- Drawer -------------------------------------------------------------------------------------

const drawer = document.getElementById("drawer");
const dBody = document.getElementById("d-body");
let drawerSeq = 0;

function closeDrawer() {
  drawer.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
  document.querySelector(`.rec[data-id="${openId}"]`)?.classList.remove("current");
  openId = null;
}

function step(delta) {
  if (!shown.length) return;
  const i = shown.findIndex((h) => h.vinylId === openId);
  const next = shown[Math.max(0, Math.min(shown.length - 1, (i < 0 ? 0 : i + delta)))];
  if (next) openDrawer(next.vinylId);
}

// After any change: reload the collection (merges/moves can change other records too) and redraw.
async function refresh() { notifyChanged(); await load(true); }

async function openDrawer(vid, { scroll = true } = {}) {
  openId = vid;
  const mine = ++drawerSeq;
  document.querySelectorAll(".rec.current").forEach((el) => el.classList.remove("current"));
  const card = document.querySelector(`.rec[data-id="${vid}"]`);
  card?.classList.add("current");
  if (scroll) card?.scrollIntoView({ block: "nearest" });
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  const idx = shown.findIndex((h) => h.vinylId === vid);
  document.getElementById("d-pos").textContent = idx >= 0 ? `${idx + 1} / ${shown.length}` : "not in the current filter";
  const { ok, data } = await api(`/api/vinyl/holding?id=${vid}`);
  if (mine !== drawerSeq) return;
  if (!ok) { dBody.innerHTML = `<div class="status-line error">${esc(data.message)}</div>`; return; }
  const scrollTop = dBody.scrollTop;
  renderDrawer(data);
  if (!scroll) dBody.scrollTop = scrollTop; // a refresh after an action keeps your place
  else dBody.scrollTop = 0;
}

function sec(title, bodyHtml, { right = "", role = "" } = {}) {
  return `<div class="sec" ${role ? `data-sec="${role}"` : ""}><div class="sec-head"><h3>${title}</h3>${right}</div><div class="sec-body">${bodyHtml}</div></div>`;
}

function renderDrawer(h) {
  const a = h.album;
  document.getElementById("d-albums").href = `/albums.html#discography/${h.artist.artistId}`;
  const art = artUrl(h);
  const rg = h.rg;
  const rgLine = rg ? `${esc([rg.primaryType, ...(rg.secondaryTypes || [])].filter(Boolean).join("/"))}${rg.firstReleaseDate ? ` · first released ${esc(rg.firstReleaseDate)}` : ""}` : "";
  const credits = h.credits.map((c) => `${esc(c.name)} ${c.mbid ? mbLink("artist", c.mbid) : `<button class="badge warn" data-jump="artist" title="Resolve below">no mbid</button>`}`).join(" · ");
  const missingArtists = h.credits.filter((c) => !c.mbid);

  const checklist = `<ul class="checklist">${h.checks.map((c) => `
    <li><span class="dot ${c.status}"></span><span class="c-label">${esc(c.label)}</span><span class="c-text">${esc(c.text)}</span>
    <span class="c-fix">${fixButton(h, c)}</span></li>`).join("")}</ul>`;

  dBody.innerHTML = `
    <div class="d-head">
      ${art ? `<img class="cover" src="${art}?t=${Date.now()}" alt="" />` : `<div class="cover"><div class="placeholder-art"></div></div>`}
      <div>
        <h2>${esc(a.title)}</h2>
        ${h.pressingTitle ? `<div class="meta" style="color:var(--accent-vinyl)">This record: <b>${esc(h.pressingTitle)}</b></div>` : ""}
        <div class="credits">${credits}</div>
        <div class="facts">
          <div>${a.year ? `<b>${a.year}</b>` : `<span class="badge warn">no year</span>`} ${h.originalYear && h.originalYear !== a.year ? `<span class="warn-text">· originally ${h.originalYear}</span>` : ""} ${pressingKind(h)}</div>
          <div>${a.mbid ? `${mbLink("album", a.mbid, "release group " + a.mbid.slice(0, 8))} <span class="meta">${rgLine}</span>` : `<span class="badge bad">no album MBID</span>`}</div>
          <div class="meta">${plural(a.scrobbleCount, "scrobble")}${a.mergedIn ? ` · ${plural(a.mergedIn, "version")} merged in` : ""}${h.otherPressings.length ? ` · ${plural(h.otherPressings.length + 1, "pressing")} owned` : ""}</div>
        </div>
      </div>
    </div>
    ${sec("Completeness", checklist)}
    ${missingArtists.length ? sec(`Artist identity <span class="meta">(${missingArtists.length} without an MBID)</span>`, `<div data-role="artists"></div>`, { role: "artist" }) : ""}
    ${sec("Genres", `<div data-role="genres"><span class="meta">Loading…</span></div>`, { role: "genres", right: `<a class="meta" href="/genres.html#browse">Genre review →</a>` })}
    ${sec("This pressing", pressingHtml(h), { right: h.discogsReleaseId ? discogsLink(h.discogsReleaseId, "Discogs release") : "" })}
    ${sec("MusicBrainz link for this pressing", `<div data-role="link"></div>`, { role: "link" })}
    ${sec("Title & year", `<div data-role="titleyear"></div>`, { role: "titleyear" })}
    ${sec("Cover art", `<div data-role="cover"></div>`, { role: "cover" })}
    ${h.versionProfiles.length ? sec(`Other versions of this album <span class="meta">(${h.versionProfiles.length})</span>`, `<div data-role="versions"></div>`, { role: "versions" }) : ""}
    ${h.otherPressingDetails.length ? sec(`Your other pressings of this album <span class="meta">— each keeps its own card; plays count once, toward the album</span>`, otherPressingsHtml(h)) : ""}
    ${sec("Album identity", `<button class="small" data-role="open-identity">Search / change the album's MusicBrainz identity…</button><div data-role="identity"></div>`, { role: "identity" })}
    ${sec("Move this pressing", `<div class="meta" style="margin-bottom:6px">If this record is attached to the wrong album, move it to the right one (same artist).</div><input type="text" data-role="move-q" placeholder="Search ${esc(h.artist.name)}'s albums…" style="width:100%" /><div data-role="move-slot"></div>`, { role: "move" })}
  `;
  const $ = (r) => dBody.querySelector(`[data-role='${r}']`);
  if (missingArtists.length) renderArtistSection($("artists"), missingArtists);
  renderLinkSection($("link"), h);
  loadGenreChips($("genres"), a.albumId);
  renderColourEditor(dBody.querySelector("[data-role='colour']"), h);
  renderTitleYear($("titleyear"), h);
  renderCover($("cover"), h);
  if (h.versionProfiles.length) {
    $("versions").appendChild(mergeTable([h.albumProfile, ...h.versionProfiles], { checkedAll: true, primary: a.albumId, onMerged: refresh }));
  }
  $("open-identity").addEventListener("click", (e) => {
    e.target.remove();
    renderAlbumResolve($("identity"), h.albumProfile, { reason: "vinyl identity", onDone: refresh });
  });
  wireMove(h);
  wireCreditAliasButtons(dBody, refresh);
  dBody.querySelectorAll("[data-otherpressing]").forEach((el) => el.addEventListener("click", () => openDrawer(parseInt(el.dataset.otherpressing, 10))));
  dBody.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => {
    const target = dBody.querySelector(`[data-sec="${b.dataset.jump}"]`);
    target?.scrollIntoView({ behavior: "smooth", block: "start" });
    if (b.dataset.jump === "identity") dBody.querySelector("[data-role='open-identity']")?.click();
    if (b.dataset.jump === "artist") dBody.querySelector("[data-role='open-artist']")?.click();
  }));
}

// -- Record colour -----------------------------------------------------------------------------
// The site shows each record in its real colour, read from the format ("Red", "Blu", Discogs'
// "Red Translucent"...). When that misses or is wrong, set it here: up to 3 colours + an effect.
const DISC_PALETTE = {
  black: "#111", white: "#e9e6df", clear: "rgba(225,228,236,.35)", red: "#b3262e", crimson: "#a4162c", oxblood: "#5a1a1f",
  orange: "#dd7426", amber: "#d9921f", yellow: "#e2bd3c", gold: "#c9a227", cream: "#eee2c4", bone: "#e8dcc2", green: "#2e8f55",
  teal: "#23857f", turquoise: "#2bb5b0", aqua: "#46b7d6", blue: "#2c63c9", "sea blue": "#2a6fa0", purple: "#7a3cc4", violet: "#8a4fd6",
  magenta: "#c2378f", pink: "#e27fac", brown: "#6f4428", grey: "#7c7f86", silver: "#b9bcc6", smoke: "rgba(110,110,120,.6)",
};
const DISC_EFFECTS = { solid: "Solid", translucent: "Translucent", marbled: "Marbled", splatter: "Splatter", split: "Split", swirl: "Swirl" };
function discSwatch(colours, effect) {
  const c = colours.map((n) => DISC_PALETTE[n] || n);
  const a = c[0] || "#111", b = c[1] || "#e9e6df", d = c[2] || b;
  const bg = effect === "split" ? `linear-gradient(90deg, ${a} 50%, ${b} 50%)`
    : effect === "marbled" || effect === "swirl" ? `conic-gradient(from 30deg, ${a}, ${b}, ${d}, ${a}, ${b}, ${a})`
    : effect === "splatter" ? `radial-gradient(circle at 30% 35%, ${b} 0 12%, transparent 13%), radial-gradient(circle at 68% 62%, ${d} 0 10%, transparent 11%), ${a}`
    : a;
  return `<span class="swatch${effect === "translucent" ? " translucent" : ""}" style="background:${bg}"></span>`;
}
function detectedColours(h) {
  const tags = (h.formatInfo?.tags || []).filter((t) => t.kind === "colour").map((t) => t.label);
  return [...tags, ...(h.formatText ? [h.formatText] : [])];
}
function renderColourEditor(host, h) {
  const cur = h.discColour;
  const detected = detectedColours(h);
  host.innerHTML = `${cur ? `${discSwatch(cur.colours, cur.effect)} <b>${esc(cur.colours.join(" / "))}</b> <span class="meta">${esc(DISC_EFFECTS[cur.effect] || cur.effect)} · set by you</span>`
      : detected.length ? `<span class="meta">detected: ${esc(detected.join(" · "))}</span>` : `<span class="meta">black (nothing in the format says otherwise)</span>`}
    <button class="small" data-role="colour-edit">${cur ? "Change" : "Set colour"}</button>
    ${cur ? `<button class="small" data-role="colour-clear" title="Go back to what the format says">Reset</button>` : ""}
    <div data-role="colour-picker" hidden></div>`;
  const picker = host.querySelector("[data-role='colour-picker']");
  let pick = [...(cur?.colours || [])], effect = cur?.effect || "solid";
  const draw = () => {
    picker.innerHTML = `<div class="palette">${Object.keys(DISC_PALETTE).map((n) => `<button class="pal${pick.includes(n) ? " on" : ""}" data-c="${esc(n)}" title="${esc(n)}">${discSwatch([n], "solid")}<span>${esc(n)}</span></button>`).join("")}</div>
      <div class="pal-row"><select data-role="effect">${Object.entries(DISC_EFFECTS).map(([k, v]) => `<option value="${k}" ${k === effect ? "selected" : ""}>${v}</option>`).join("")}</select>
        <span>${pick.length ? `${discSwatch(pick, effect)} ${esc(pick.join(" / "))}` : `<span class="meta">pick up to 3 colours</span>`}</span>
        <button class="small good" data-role="colour-save" ${pick.length ? "" : "disabled"}>Save</button></div>`;
    picker.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => {
      const n = b.dataset.c;
      pick = pick.includes(n) ? pick.filter((x) => x !== n) : [...pick, n].slice(-3);
      draw();
    }));
    picker.querySelector("[data-role='effect']").addEventListener("change", (e) => { effect = e.target.value; draw(); });
    picker.querySelector("[data-role='colour-save']").addEventListener("click", () => save({ colours: pick, effect }));
  };
  async function save(body) {
    const { ok, data } = await api("/api/vinyl/colour", { vinylId: h.vinylId, ...body });
    if (!ok) { toast(esc(data.message), { error: true }); return; }
    h.discColour = data.discColour;
    if (data.editId) toast(body.clear ? "Colour back to what the format says" : `Colour set: ${esc(data.discColour.colours.join(" / "))}`, { undo: { kind: "edit", id: data.editId, onUndone: () => openDrawer(h.vinylId, { scroll: false }) } });
    notifyChanged();
    renderColourEditor(host, h);
  }
  host.querySelector("[data-role='colour-edit']").addEventListener("click", () => { picker.hidden = !picker.hidden; if (!picker.hidden) draw(); });
  host.querySelector("[data-role='colour-clear']")?.addEventListener("click", () => save({ clear: true }));
}

// The album's genre tags, editable in place (see Maintenance > Genres for the whole picture).
async function loadGenreChips(host, albumId) {
  const { ok, data } = await api(`/api/genres/album?albumId=${albumId}`);
  if (!ok || !host.isConnected) return;
  mountGenreChips(host, albumId, data.genres, { onChange: () => loadGenreChips(host, albumId) });
  if (!data.genres.length) host.insertAdjacentHTML("afterbegin", `<span class="meta" style="margin-right:6px">none yet —</span>`);
}

// The quick fix next to each checklist line: either a direct action or a jump to its section.
function fixButton(h, c) {
  if (done(c)) return "";
  switch (c.fix) {
    case "year": return keyBtn("y", `Use ${h.originalYear}`, "good", 'data-act="use-year"');
    case "title": return keyBtn("t", `Use “${esc(h.album.baseTitle)}”`, "", 'data-act="clean-title"');
    case "suggestion": return `<button class="small" data-jump="link">Review ↓</button>`;
    case "lookup": return `<button class="small" data-jump="link">Look up ↓</button>`;
    case "cover": return `<button class="small" data-jump="cover">Fix ↓</button>`;
    case "versions": return `<button class="small" data-jump="versions">Review ↓</button>`;
    case "identity": return `<button class="small" data-jump="identity">Fix ↓</button>`;
    case "credit": return `${creditAliasButton(c.credit)} <button class="small" data-jump="identity">Wrong album ↓</button>`;
    default:
      if (c.key === "artist") return keyBtn("i", "Resolve ↓", "", 'data-jump="artist"');
      if (c.key === "album") return `<button class="small" data-jump="identity">Set ↓</button>`;
      return "";
  }
}

    <dt>Colour</dt><dd data-role="colour"></dd>

    <dt>Rating</dt><dd>${stars(h.rating) || "—"}</dd>

      <div class="meta">${esc(o.label || "")}${o.catalogNumber ? ` · ${esc(o.catalogNumber)}` : ""} · added ${esc(fmtDate(o.dateAdded))} ${o.mbReleaseId ? mbLink("release", o.mbReleaseId) : ""}</div></div>

// -- Artist identity (credited artists without an MBID) ---------------------------------------
// The same toolkit as the Artists page -- what was scrobbled, MusicBrainz search with each top
// result's discography checked against your albums (this record included), manual id, merge
// into an artist you already have -- right here, since a vinyl-only artist with 0-1 scrobbles is
// otherwise hard to find.

function renderArtistSection(el, artists) {
  el.innerHTML = artists.map((c, i) => `
    <div class="link-card" data-artist="${c.artistId}">
      <div style="display:flex; justify-content:space-between; gap:10px; align-items:center">
        <div><b>${esc(c.name)}</b> <span class="badge warn">no mbid</span></div>
        <div style="display:flex; gap:6px">
          <button class="small primary" data-role="${i === 0 ? "open-artist" : "open-artist-x"}">Resolve here</button>
          <a class="small btn" href="/artists.html#missing/${c.artistId}">On the Artists page →</a>
        </div>
      </div>
      <div data-role="artist-slot"></div>
    </div>`).join("");
  el.querySelectorAll("[data-artist]").forEach((card) => {
    const c = artists.find((x) => x.artistId === parseInt(card.dataset.artist, 10));
    const btn = card.querySelector("[data-role^='open-artist']");
    btn.addEventListener("click", () => {
      btn.remove();
      renderArtistResolve(card.querySelector("[data-role='artist-slot']"), { artistId: c.artistId, name: c.name }, { reason: "vinyl", onDone: refresh });
    });
  });
}

// -- MusicBrainz link for the pressing -------------------------------------------------------

function renderLinkSection(el, h) {
  const a = h.album;
  if (h.mbReleaseId && !h.suggestions.length) {
    const prg = h.pressingRg;
    const mismatch = prg && a.mbid && prg.mbid !== a.mbid;
    el.innerHTML = `<div>Linked to ${mbLink("release", h.mbReleaseId, "MusicBrainz release " + h.mbReleaseId.slice(0, 8))}${prg ? ` — release group ${mbLink("album", prg.mbid)} “${esc(prg.title)}” (${esc(prg.firstReleaseDate || "?")})` : ""}.</div>
      ${mismatch ? `<div class="notice bad" style="margin-top:8px">That release group isn't the album's (${mbLink("album", a.mbid)}). Either the album's identity is wrong (fix it under “Album identity”) or this pressing is on the wrong album (use “Move this pressing”).</div>` : ""}`;
    return;
  }
  if (!h.suggestions.length) {
    const fullyChecked = h.discogsChecked && h.discogsDetailsChecked;
    const txt = !h.discogsReleaseId ? "This holding has no Discogs release id to look up."
      : fullyChecked ? (h.discogsLinks.length ? "The MusicBrainz link for this Discogs release was rejected."
          : "Neither MusicBrainz nor the Discogs master give an exact match for this record — use “Album identity” below to search instead.")
      : "Ask MusicBrainz which release this exact Discogs pressing is — and if it doesn't know the pressing, which album its Discogs master is. Exact, curated mappings, never a guess.";
    el.innerHTML = `<div class="meta">${esc(txt)}</div>${h.discogsReleaseId && !fullyChecked ? `<div style="margin-top:8px">${keyBtn("l", "Look up on MusicBrainz", "primary", 'data-act="lookup"')}</div>` : ""}`;
    el.querySelector("[data-act='lookup']")?.addEventListener("click", async (e) => {
      e.currentTarget.disabled = true;
      el.insertAdjacentHTML("beforeend", `<div class="status-line">Asking MusicBrainz…</div>`);
      const { ok, data } = await api("/api/vinyl/discogs-lookup", { holdingId: h.vinylId });
      if (!ok) { toast(esc(data.message), { error: true }); return; }
      toast(data.suggestionsMade ? "MusicBrainz knows this pressing — review the link" : "MusicBrainz has no link for this Discogs release");
      refresh();
    });
    return;
  }
  el.innerHTML = "";
  h.suggestions.forEach((s, i) => el.appendChild(linkCard(h, s, i === 0)));
}

function actionBtn(key, label, cls, attrs) {
  return key ? keyBtn(key, label, cls, attrs) : `<button class="small ${cls}" ${attrs}>${label}</button>`;
}

function linkCard(h, s, first) {
  const a = h.album;
  const ev = s.evidence, rg = ev.rg || {};
  const types = [rg.primaryType, ...(rg.secondaryTypes || [])].filter(Boolean).join("/");
  const rgYear = (rg.firstReleaseDate || "").slice(0, 4);
  const titleDiffers = rg.title && rg.title !== a.title;
  const div = document.createElement("div");
  div.className = "link-card";
  const master = ev.kind === "master";
  let explain, actions;
  if (ev.relation === "confirms") {
    explain = master
      ? `<span class="ok-text">Confirms the album's identity</span> — MusicBrainz doesn't list this exact pressing, but its Discogs master is this release group.`
      : `<span class="ok-text">Confirms the album's identity</span> — this pressing is a release of the same release group.`;
    actions = actionBtn(first ? "a" : "", master ? "Confirm album identity" : "Link this pressing", "good", 'data-act="none"');
  } else if (ev.relation === "sets") {
    explain = `The album has no MBID yet — accepting gives it this release group${rgYear ? ` and its original year ${rgYear}` : ""}.`;
    actions = actionBtn(first ? "a" : "", master ? "Set album identity" : "Link pressing & set album identity", "good", 'data-act="identity"')
      + (titleDiffers ? ` <label class="meta"><input type="checkbox" data-role="use-title" ${a.editionTags.length ? "checked" : ""}/> also rename to “${esc(rg.title)}”</label>` : "");
  } else {
    explain = `<span class="bad-text">Doesn't match.</span> This pressing belongs to a different release group than the album's current MBID (${mbLink("album", a.mbid)}). Which one is wrong?`;
    actions = `<button class="small" data-act="identity">The album's MBID is wrong — use this one</button>
      <button class="small" data-act="find-move">This pressing is on the wrong album — move it</button>`;
  }
  const rgHtml = `<b>${esc(rg.title || "?")}</b> ${mbLink("album", rg.mbid)} <span class="meta">${esc(types)}${rg.firstReleaseDate ? ` · first released ${esc(rg.firstReleaseDate)}` : ""} · ${esc(rg.artistCredit || "")}</span>`;
  div.innerHTML = `
    <div>${master
      ? `<span class="badge accent">via Discogs master</span> <a class="mb" href="https://www.discogs.com/master/${ev.masterId}" target="_blank" rel="noopener">master ${ev.masterId} ↗</a> <span class="meta">is</span> ${rgHtml}`
      : `<b>${esc(ev.releaseTitle || s.label)}</b> ${mbLink("release", ev.releaseMbid, "release")} <span class="meta">is a release of</span> ${rgHtml}`}</div>
    ${ev.artistMatches === false ? `<div class="warn-text meta">⚠ MusicBrainz credits it to “${esc(rg.artistCredit)}”, not ${esc(h.artist.name)}</div>` : ""}
    <div class="meta" style="margin-top:4px">${explain}</div>
    <div class="actions">${actions}${actionBtn(first ? "r" : "", "Reject", "bad", 'data-act="reject"')}</div>
    <div data-role="slot"></div>`;
  const slot = div.querySelector("[data-role='slot']");

  async function accept(albumAction, extraBody = {}) {
    div.querySelectorAll("button").forEach((b) => (b.disabled = true));
    const useTitle = div.querySelector("[data-role='use-title']")?.checked || false;
    const res = await api("/api/vinyl/link-release", { holdingId: h.vinylId, suggestionId: s.id, albumAction, useTitle, ...extraBody });
    if (res.status === 409 && res.data.conflictingAlbum) {
      div.querySelectorAll("button").forEach((b) => (b.disabled = false));
      slot.innerHTML = `<div class="notice warn" style="margin-top:8px"><div class="headline">${esc(res.data.message)}</div>
        <div class="meta">They're the same album — merge them, keeping whichever you want as the primary (it takes this release group and original year). Then link the pressing.</div><div data-role="cmp"></div></div>`;
      renderAlbumCompare(slot.querySelector("[data-role='cmp']"), a.albumId, res.data.conflictingAlbum.albumId, {
        keys: false, defaultKeep: "a", identity: { mbid: res.data.identity.mbid, year: res.data.identity.year }, onMerged: refresh,
      });
      return;
    }
    if (!res.ok) { div.querySelectorAll("button").forEach((b) => (b.disabled = false)); toast(esc(res.data.message), { error: true }); return; }
    const what = master ? (albumAction === "identity" ? "Set the album's identity for" : albumAction === "move" ? "Moved" : "Confirmed the identity of")
      : (albumAction === "identity" ? "Linked the pressing and set the album's identity for" : albumAction === "move" ? "Moved and linked" : "Linked the pressing of");
    toast(`${what} <b>${esc(a.title)}</b>`,
      { undo: res.data.editIds.length ? { kind: "edit", id: res.data.editIds } : undefined });
    refresh();
  }
  div.querySelector("[data-act='none']")?.addEventListener("click", () => accept("none"));
  div.querySelector("[data-act='identity']")?.addEventListener("click", () => accept("identity"));
  div.querySelector("[data-act='find-move']")?.addEventListener("click", async () => {
    const { ok, data } = await api(`/api/albums/discography?artistId=${h.artist.artistId}`);
    const target = ok && data.albums.find((x) => x.mbid === rg.mbid);
    slot.innerHTML = target
      ? `<div class="notice" style="margin-top:8px"><div>Your album <b>${esc(target.title)}</b> ${mbLink("album", target.mbid)} already has that release group.</div>
          <div class="actions" style="margin-top:6px"><button class="small good" data-role="do-move">Move this pressing there and link it</button></div></div>`
      : `<div class="notice warn" style="margin-top:8px">None of ${esc(h.artist.name)}'s albums has that release group yet. If the album itself is wrong, use “The album's MBID is wrong”; otherwise move the pressing by hand below.</div>`;
    slot.querySelector("[data-role='do-move']")?.addEventListener("click", () => accept("move", { moveToAlbumId: target.albumId }));
  });
  div.querySelector("[data-act='reject']").addEventListener("click", async () => {
    const res = await api("/api/suggestions/decide", { id: s.id, action: "reject" });
    if (!res.ok) { toast(esc(res.data.message), { error: true }); return; }
    toast("Link rejected — it won't be suggested again");
    refresh();
  });
  return div;
}

// -- Title & year --------------------------------------------------------------------------------

function renderTitleYear(el, h) {
  const a = h.album;
  el.innerHTML = `
    <div class="inline-edit">
      <input type="text" data-role="title" value="${esc(a.title)}" />
      <input type="number" data-role="year" value="${a.year ?? ""}" placeholder="year" />
      <button class="small primary" data-role="save">Save</button>
    </div>
    <div class="meta" style="margin-top:6px">
      The album is the work, not this copy: use the <b>original</b> release's title and first-release year${h.originalYear ? ` (MusicBrainz: ${h.originalYear}${h.rg ? `, “${esc(h.rg.title)}”` : ""})` : ""}.
      ${h.pressingYear ? `This pressing is from ${h.pressingYear} — that stays on the pressing, not the album.` : ""}
    </div>`;
  const save = async (changes) => {
    const res = await api("/api/albums/edit", { albumId: a.albumId, ...changes, reason: "vinyl title/year" });
    if (!res.ok) { toast(esc(res.data.message), { error: true }); return; }
    if (!res.data.editId) { toast("Nothing changed"); return; }
    toast(`Updated <b>${esc(res.data.title)}</b>`, { undo: { kind: "edit", id: res.data.editId } });
    refresh();
  };
  el.querySelector("[data-role='save']").addEventListener("click", () => {
    const title = el.querySelector("[data-role='title']").value.trim();
    const year = el.querySelector("[data-role='year']").value.trim();
    save({ title: title !== a.title ? title : undefined, year: year && parseInt(year, 10) !== a.year ? parseInt(year, 10) : undefined });
  });
  el.querySelectorAll("input").forEach((i) => i.addEventListener("keydown", (e) => { if (e.key === "Enter") el.querySelector("[data-role='save']").click(); }));
  // checklist quick fixes
  dBody.querySelector("[data-act='use-year']")?.addEventListener("click", () => save({ year: h.originalYear }));
  dBody.querySelector("[data-act='clean-title']")?.addEventListener("click", () => save({ title: a.baseTitle }));
}

// -- Cover ---------------------------------------------------------------------------------------

function renderCover(el, h) {
  const a = h.album;
  const has = a.coverStatus === "ok";
  el.innerHTML = `
    <div style="display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap">
      ${has ? `<img class="big-cover" src="/covers/${a.albumId}.jpg?t=${Date.now()}" alt="" />` : ""}
      <div style="flex:1; min-width:240px">
        <div class="meta">${has ? "The album's cover (the original release's art, shared by every pressing)." : a.coverStatus === "none" ? "The Cover Art Archive had nothing for this release group — paste a direct image link instead." : "No cover fetched yet."}</div>
        <div class="inline-form" style="margin-top:8px">
          ${keyBtn("c", has ? "Re-fetch from MusicBrainz" : "Fetch from MusicBrainz", "", `data-act="fetch" ${a.mbid ? "" : "disabled title=\"Needs an album MBID first\""}`)}
        </div>
        <div class="inline-form" style="margin-top:8px"><input type="text" data-role="url" placeholder="https://… (a direct image link)" style="flex:1; min-width:220px" /><button class="small" data-act="url">Use this image</button></div>
      </div>
    </div>`;
  el.querySelector("[data-act='fetch']").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    const { ok, data } = await api("/api/albums/fetch-cover", { albumId: a.albumId });
    if (!ok) { toast(esc(data.message), { error: true }); btn.disabled = false; return; }
    toast(data.found ? `Cover art saved for <b>${esc(a.title)}</b>` : "The Cover Art Archive has no art for this release group", { error: !data.found });
    refresh();
  });
  el.querySelector("[data-act='url']").addEventListener("click", async () => {
    const url = el.querySelector("[data-role='url']").value.trim();
    if (!url) return;
    const { ok, data } = await api("/api/albums/set-cover", { albumId: a.albumId, url });
    if (!ok) { toast(esc(data.message), { error: true }); return; }
    toast(`Cover art saved for <b>${esc(a.title)}</b>`);
    refresh();
  });
}

// -- Move pressing ------------------------------------------------------------------------------

let moveTypeahead = null;
function wireMove(h) {
  moveTypeahead?.destroy(); // the drawer is re-rendered per record -- drop the previous popover
  const input = dBody.querySelector("[data-role='move-q']");
  const slot = dBody.querySelector("[data-role='move-slot']");
  let albums = null;
  moveTypeahead = mountTypeahead(input, {
    fetchItems: async (q) => {
      if (!albums) albums = (await api(`/api/albums/discography?artistId=${h.artist.artistId}`)).data.albums || [];
      const ql = q.toLowerCase();
      return albums.filter((x) => x.albumId !== h.album.albumId && x.title.toLowerCase().includes(ql)).slice(0, 15);
    },
    renderItem: (x) => `<span>${esc(x.title)} ${x.year ? `<span class="meta">(${x.year})</span>` : ""} ${x.mbid ? `<span class="badge ok">mbid</span>` : ""}</span><span class="meta">${fmtNum(x.scrobbleCount)} plays</span>`,
    onPick: (x) => {
      slot.innerHTML = `<div class="notice" style="margin-top:8px">Move this pressing from <b>${esc(h.album.title)}</b> to <b>${esc(x.title)}</b>${x.year ? ` (${x.year})` : ""} ${x.mbid ? mbLink("album", x.mbid) : ""}?
        <div style="margin-top:6px; display:flex; gap:6px"><button class="small danger" data-role="go">Move it</button><button class="small" data-role="cancel">Cancel</button></div></div>`;
      slot.querySelector("[data-role='cancel']").addEventListener("click", () => { slot.innerHTML = ""; });
      slot.querySelector("[data-role='go']").addEventListener("click", async () => {
        const res = await api("/api/vinyl/move", { holdingId: h.vinylId, albumId: x.albumId });
        if (!res.ok) { toast(esc(res.data.message), { error: true }); return; }
        toast(`Moved the pressing to <b>${esc(res.data.albumTitle)}</b>`, { undo: { kind: "edit", id: res.data.editId } });
        refresh();
      });
    },
  });
}

// -- Keyboard -----------------------------------------------------------------------------------

document.getElementById("d-close").addEventListener("click", closeDrawer);
document.getElementById("d-prev").addEventListener("click", () => step(-1));
document.getElementById("d-next").addEventListener("click", () => step(1));
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape" && openId) { closeDrawer(); return; }
  if (!openId) {
    if (e.key === "j" && shown.length) { openDrawer(shown[0].vinylId); e.preventDefault(); }
    return;
  }
  if (e.key === "j") { step(1); e.preventDefault(); return; }
  if (e.key === "k") { step(-1); e.preventDefault(); return; }
  const btn = dBody.querySelector(`[data-key="${CSS.escape(e.key)}"]:not(:disabled)`);
  if (btn) { btn.click(); e.preventDefault(); }
});

// -- Bulk actions (always reviewed first) -----------------------------------------------------

const bulkPanel = document.getElementById("bulk-panel");
function updateBulkButtons() {
  const links = all.filter((h) => !h.mbReleaseId && h.suggestions.some((s) => s.evidence.relation === "confirms")).length;
  const years = new Set(all.filter((h) => check(h, "year").fix === "year" && check(h, "identity").status === "ok").map((h) => h.album.albumId)).size;
  const covers = new Set(all.filter((h) => h.album.mbid && !h.album.coverStatus).map((h) => h.album.albumId)).size;
  const set = (id, label, n) => { const b = document.getElementById(id); b.textContent = `${label} (${n})`; b.disabled = !n; };
  set("bulk-links", "Review confirmed pressing links", links);
  set("bulk-years", "Review original years", years);
  set("bulk-covers", "Fetch missing covers", covers);
}

async function openBulk(action, title, blurb) {
  const { ok, data } = await api(`/api/vinyl/bulk-preview?action=${action}`);
  if (!ok) { toast(esc(data.message), { error: true }); return; }
  const rows = data.rows;
  bulkPanel.innerHTML = `<div class="sec" style="margin-top:12px">
    <div class="block-head"><div><b>${esc(title)}</b> <span class="meta">${esc(blurb)}</span></div>
      <div style="display:flex; gap:6px"><button class="small good" data-role="apply">Apply ${rows.length}</button><button class="small" data-role="cancel">Cancel</button></div></div>
    <div class="table-scroll" style="max-height:360px; overflow-y:auto"><table class="data"><thead><tr><th><input type="checkbox" data-role="all" checked /></th><th>Artist</th><th>Album</th><th>Change</th><th>Pressing</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr><td><input type="checkbox" data-i="${i}" checked /></td><td>${esc(r.artist)}</td><td>${esc(r.title)}</td>
      <td>${esc(r.detail)} ${r.releaseMbid ? mbLink("release", r.releaseMbid) : ""}</td><td class="meta">${esc(r.format || "")}${r.pressingYear ? ` · ${r.pressingYear}` : ""}</td></tr>`).join("")}</tbody></table></div></div>`;
  const boxes = () => [...bulkPanel.querySelectorAll("input[data-i]")];
  const apply = bulkPanel.querySelector("[data-role='apply']");
  const recount = () => {
    const n = boxes().filter((b) => b.checked).length;
    apply.textContent = `Apply ${n}`; apply.disabled = !n;
    const all = bulkPanel.querySelector("[data-role='all']");
    all.checked = n === boxes().length; all.indeterminate = n > 0 && n < boxes().length;
  };
  bulkPanel.querySelector("[data-role='all']").addEventListener("change", (e) => { boxes().forEach((b) => (b.checked = e.target.checked)); recount(); });
  boxes().forEach((b) => b.addEventListener("change", recount));
  bulkPanel.querySelector("[data-role='cancel']").addEventListener("click", () => { bulkPanel.innerHTML = ""; });
  apply.addEventListener("click", async () => {
    const chosen = boxes().filter((b) => b.checked).map((b) => rows[parseInt(b.dataset.i, 10)]);
    apply.disabled = true;
    const res = await api("/api/vinyl/bulk", { action, rows: chosen });
    if (!res.ok) { toast(esc(res.data.message), { error: true }); apply.disabled = false; return; }
    bulkPanel.innerHTML = "";
    toast(`Applied ${res.data.applied} change${res.data.applied === 1 ? "" : "s"}`, { undo: res.data.editIds.length ? { kind: "edit", id: res.data.editIds } : undefined, timeout: 20000 });
    refresh();
  });
}

document.getElementById("bulk-links").addEventListener("click", () => openBulk("link-confirmations", "Link confirmed pressings",
  "MusicBrainz says each of these pressings is a release of the album's own release group — linking changes nothing else."));
document.getElementById("bulk-years").addEventListener("click", () => openBulk("original-years", "Set original years",
  "Only albums whose identity is verified: the year becomes the release group's first-release year."));
document.getElementById("bulk-covers").addEventListener("click", async (e) => {
  const targets = [...new Map(all.filter((h) => h.album.mbid && !h.album.coverStatus).map((h) => [h.album.albumId, h])).values()];
  const btn = e.currentTarget;
  btn.disabled = true;
  let found = 0;
  for (let i = 0; i < targets.length; i++) {
    btn.textContent = `Fetching… ${i + 1}/${targets.length}`;
    const { ok, data } = await api("/api/albums/fetch-cover", { albumId: targets[i].album.albumId });
    if (ok && data.found) found++;
    await new Promise((r) => setTimeout(r, 250)); // polite to the Cover Art Archive
  }
  toast(`Fetched covers — found ${found} of ${targets.length}`);
  refresh();
});

document.getElementById("sweep-btn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;
  await runSweep(document.getElementById("sweep-box"), "vinyl-check", parseInt(document.getElementById("sweep-limit").value, 10) || 50);
  btn.disabled = false;
  refresh();
});

document.addEventListener("mc:undone", () => load(true));
load(false);
</script>
