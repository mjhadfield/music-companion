<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Music Companion — Album MBIDs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Same dark palette as index.html/artists.html -- local-only tool, no light mode. */
  :root {
    --bg: #0d0a10;
    --bg-elevated: #17121c;
    --border: #332a3d;
    --text: #f1ecf5;
    --text-dim: #a89bb5;
    --text-muted: #7d7188;
    --accent-vinyl: #b8822a;
    --accent-scrobble: #d43e78;
    --accent-live: #8b4fd6;
    --accent: #8b4fd6;
    --warn: #e2a33e;
    --danger: #c0453f;
    --font-display: "Oswald", "Arial Narrow", -apple-system, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); line-height: 1.5; }
  a { color: var(--accent); }
  main { max-width: 820px; margin: 0 auto; padding: 40px 24px 80px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
  h1 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; font-size: 1.6rem; margin: 0; }
  .back-link { font-size: 0.85rem; white-space: nowrap; }
  .subtitle { color: var(--text-dim); font-size: 0.9rem; margin: 0 0 30px; }

  .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; margin-bottom: 24px; }

  .queue-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .queue-controls label { font-size: 0.85rem; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
  .queue-controls input[type="number"] {
    width: 70px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 10px; font-size: 0.9rem;
  }
  button {
    font-family: var(--font-body); border: 1px solid var(--border); background: var(--bg);
    color: var(--text); border-radius: 7px; padding: 7px 14px; font-size: 0.85rem; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.12); }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

  #queue-progress { color: var(--text-dim); font-size: 0.85rem; margin-left: auto; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { color: var(--text-dim); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  td.count { text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  td.actions { text-align: right; }
  #queue-tbody tr:last-of-type td { border-bottom: none; }
  #queue-empty { color: var(--text-dim); font-size: 0.88rem; padding: 8px; display: none; }

  .resolve-row td { background: var(--bg); border-bottom: 1px solid var(--border); padding: 16px 18px; }
  .resolve-section { margin-bottom: 16px; }
  .resolve-section:last-child { margin-bottom: 0; }
  .resolve-section h3 {
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.03em;
    font-size: 0.78rem; color: var(--text-dim); margin: 0 0 8px;
  }
  .resolve-row input[type="text"] {
    background: var(--bg-elevated); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 10px; font-size: 0.88rem; width: 260px;
  }
  .inline-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .track-list, .vinyl-list { margin: 0; padding-left: 20px; font-size: 0.88rem; }
  .track-list li, .vinyl-list li { padding: 2px 0; }
  .track-list .meta, .vinyl-list .meta { color: var(--text-dim); }

  .mb-candidate, .conflict-banner, .merge-confirm {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; margin-top: 6px;
    background: var(--bg-elevated); font-size: 0.85rem;
  }
  .mb-candidate .meta, .conflict-banner .meta, .merge-confirm .meta { color: var(--text-dim); font-size: 0.78rem; }
  .conflict-banner { border-color: var(--warn); }
  .conflict-banner .headline { color: var(--warn); }

  .search-wrap { position: relative; }
  .search-results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 5;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px;
    max-height: 240px; overflow-y: auto;
  }
  .search-result-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 12px; cursor: pointer; font-size: 0.85rem;
  }
  .search-result-row:hover { background: var(--bg); }
  .search-result-row .meta { color: var(--text-dim); font-size: 0.76rem; }

  .status-line { font-size: 0.82rem; margin-top: 8px; }
  .status-line.error { color: var(--danger); }
  .status-line.ok { color: var(--accent-scrobble); }

  #action-log { list-style: none; margin: 0; padding: 0; font-size: 0.85rem; }
  #action-log li { padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--text-dim); }
  #action-log li:last-child { border-bottom: none; }
  #action-log li .who { color: var(--text); }

  #log-section { display: none; }
  #log-status {
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em;
    font-size: 0.85rem; color: var(--text-dim); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .spinner { width: 13px; height: 13px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #log {
    background: #0a0810; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 0.82rem; white-space: pre-wrap;
    word-break: break-word; max-height: 60vh; overflow-y: auto;
  }
  .log-line { padding: 1px 0; }
  .log-line.header { color: var(--accent); font-weight: 700; margin-top: 6px; }
  .log-line.warn { color: var(--warn); font-weight: 600; }
  .log-line.dim { color: var(--text-muted); }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <h1>Album MBIDs</h1>
    <a href="/" class="back-link">← Maintenance home</a>
  </div>
  <p class="subtitle">Fuzzy-search MusicBrainz release groups, enter an id by hand, or merge into an album you already have.</p>

  <div class="card">
    <div class="queue-controls">
      <label>Minimum activity <input type="number" id="min-count" value="3" min="1" /></label>
      <button id="refresh-queue-btn">Refresh</button>
      <span id="queue-progress"></span>
    </div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Album</th><th>Artist</th><th style="text-align:right">Scrobbles</th><th style="text-align:right">Vinyl</th><th></th></tr></thead>
      <tbody id="queue-tbody"></tbody>
    </table>
    <div id="queue-empty">Nothing at this threshold — lower it to find more, or you're all caught up.</div>
  </div>

  <div class="card" id="action-log-card" style="display:none">
    <div class="resolve-section" style="margin-bottom:0">
      <h3>Recent actions</h3>
      <ul id="action-log"></ul>
    </div>
  </div>

  <div class="card">
    <button id="build-btn">Rebuild public database →</button>
    <div id="log-section">
      <div id="log-status"><span id="spinner" class="spinner"></span> <span id="log-status-text">Running…</span></div>
      <div id="log"></div>
    </div>
  </div>
</main>

<script src="shared.js"></script>
<script>
const minCountInput = document.getElementById("min-count");
const refreshQueueBtn = document.getElementById("refresh-queue-btn");
const queueProgress = document.getElementById("queue-progress");
const queueTbody = document.getElementById("queue-tbody");
const queueEmpty = document.getElementById("queue-empty");
const actionLogCard = document.getElementById("action-log-card");
const actionLog = document.getElementById("action-log");
const buildBtn = document.getElementById("build-btn");
const logSection = document.getElementById("log-section");
const logEl = document.getElementById("log");
const logStatusText = document.getElementById("log-status-text");

function logAction(text) {
  actionLogCard.style.display = "block";
  const li = document.createElement("li");
  li.innerHTML = text;
  actionLog.insertBefore(li, actionLog.firstChild);
  while (actionLog.children.length > 5) actionLog.removeChild(actionLog.lastChild);
}

async function loadQueue() {
  const minCount = Math.max(1, parseInt(minCountInput.value, 10) || 3);
  minCountInput.value = minCount;
  queueTbody.innerHTML = "";
  queueProgress.textContent = "Loading…";

  const res = await fetch(`/api/albums/missing-mbid?minCount=${minCount}`);
  const data = await res.json();
  if (!res.ok) {
    queueProgress.textContent = data.error || "Something went wrong.";
    return;
  }

  queueProgress.textContent = `${data.queueCount} of ${data.totalMissing} missing overall at threshold ${data.minCount}`;
  queueEmpty.style.display = data.rows.length ? "none" : "block";
  for (const row of data.rows) {
    queueTbody.appendChild(renderQueueRow(row));
  }
}

function renderQueueRow(row) {
  const tr = document.createElement("tr");
  tr.dataset.albumId = row.albumId;
  tr.innerHTML = `
    <td>${esc(row.title)}</td>
    <td>${esc(row.artistName)}</td>
    <td class="count">${row.scrobbleCount.toLocaleString()}</td>
    <td class="count">${row.vinylCount.toLocaleString()}</td>
    <td class="actions"><button data-role="resolve">Resolve</button></td>
  `;
  tr.querySelector("[data-role='resolve']").addEventListener("click", () => togglePanel(row));
  return tr;
}

function removeAlbumRow(albumId) {
  const tr = queueTbody.querySelector(`tr[data-album-id="${albumId}"]`);
  if (tr) tr.remove();
  const panel = queueTbody.querySelector(`tr.resolve-row[data-for="${albumId}"]`);
  if (panel) panel.remove();
}

function togglePanel(row) {
  const existingPanel = queueTbody.querySelector(`tr.resolve-row[data-for="${row.albumId}"]`);
  if (existingPanel) {
    existingPanel.remove();
    return;
  }
  const oldPanel = queueTbody.querySelector("tr.resolve-row");
  if (oldPanel) oldPanel.remove();

  const tr = queueTbody.querySelector(`tr[data-album-id="${row.albumId}"]`);
  const panel = buildResolvePanel(row);
  tr.after(panel);
}

function buildResolvePanel(row) {
  const tr = document.createElement("tr");
  tr.className = "resolve-row";
  tr.dataset.for = row.albumId;
  const td = document.createElement("td");
  td.colSpan = 5;
  td.innerHTML = `
    <div class="resolve-section">
      <h3>Tracklist &amp; vinyl copies</h3>
      <div data-role="tracklist"><div class="status-line">Loading…</div></div>
    </div>
    <div class="resolve-section">
      <h3>Search MusicBrainz</h3>
      <div class="inline-form">
        <input type="text" data-role="mb-query" value="${esc(row.title)}" />
        <button data-role="mb-search">Search</button>
      </div>
      <div data-role="mb-results"></div>
    </div>
    <div class="resolve-section">
      <h3>Enter MBID manually</h3>
      <div class="inline-form">
        <input type="text" data-role="manual-mbid" placeholder="e.g. f5093c06-23e3-404f-aeaa-40f72885ee3a" />
        <button data-role="manual-assign">Assign</button>
      </div>
    </div>
    <div class="resolve-section">
      <h3>Merge into an album you already have</h3>
      <div class="search-wrap">
        <input type="text" data-role="merge-query" placeholder="Search your library…" autocomplete="off" />
        <div data-role="merge-results" class="search-results" hidden></div>
      </div>
      <div data-role="merge-confirm-slot"></div>
    </div>
    <div data-role="status" class="status-line"></div>
  `;

  tr.appendChild(td);

  wireMbSearch(td, row);
  wireManualAssign(td, row);
  wireMergeSearch(td, row);
  loadTracklist(td, row);
  runMbSearch(td, row.title, row);
  return tr;
}

// Surfaces the actual tracklist and any vinyl copies already linked to this
// album -- the fastest way to tell which specific release ("Remastered",
// "Deluxe Edition", the original pressing…) this row really is before
// trusting a MusicBrainz match to it.
async function loadTracklist(panelTd, row) {
  const resultsEl = panelTd.querySelector("[data-role='tracklist']");
  const res = await fetch(`/api/albums/tracklist?id=${row.albumId}`);
  const data = await res.json();
  if (!res.ok) {
    resultsEl.innerHTML = `<div class="status-line error">${esc(data.error || "Couldn't load tracklist.")}</div>`;
    return;
  }
  const tracks = data.songs.length
    ? `<ol class="track-list">${data.songs
        .map((s) => `<li>${esc(s.title)}${s.scrobbleCount ? ` <span class="meta">(${s.scrobbleCount.toLocaleString()})</span>` : ""}</li>`)
        .join("")}</ol>`
    : `<div class="status-line">No songs linked yet.</div>`;
  const vinyl = data.vinylCopies.length
    ? `<ul class="vinyl-list">${data.vinylCopies
        .map((v) => `<li>${esc(v.format || "Unknown format")} <span class="meta">${esc([v.label, v.catalogNumber, v.condition].filter(Boolean).join(" · "))}</span></li>`)
        .join("")}</ul>`
    : `<div class="status-line">No vinyl copies linked yet.</div>`;
  resultsEl.innerHTML = `<div style="margin-bottom:10px">${tracks}</div>${vinyl}`;
}

function setStatus(panelTd, text, kind) {
  const el = panelTd.querySelector("[data-role='status']");
  el.textContent = text || "";
  el.className = "status-line" + (kind ? ` ${kind}` : "");
}

// -- MusicBrainz search -------------------------------------------------

function wireMbSearch(panelTd, row) {
  panelTd.querySelector("[data-role='mb-search']").addEventListener("click", () => {
    runMbSearch(panelTd, panelTd.querySelector("[data-role='mb-query']").value.trim(), row);
  });
}

async function runMbSearch(panelTd, query, row) {
  const resultsEl = panelTd.querySelector("[data-role='mb-results']");
  if (!query) { resultsEl.innerHTML = ""; return; }
  resultsEl.innerHTML = `<div class="status-line">Searching…</div>`;
  const params = new URLSearchParams({ q: query, artistName: row.artistName });
  if (row.artistMbid) params.set("artistMbid", row.artistMbid);
  const res = await fetch(`/api/albums/mb-search?${params}`);
  const data = await res.json();
  if (!res.ok) {
    resultsEl.innerHTML = `<div class="status-line error">${esc(data.error || "Search failed.")}</div>`;
    return;
  }
  if (!data.candidates.length) {
    resultsEl.innerHTML = `<div class="status-line">No matches.</div>`;
    return;
  }
  resultsEl.innerHTML = "";
  for (const c of data.candidates) {
    const div = document.createElement("div");
    div.className = "mb-candidate";
    const types = [c.primaryType, ...(c.secondaryTypes || [])].filter(Boolean).join("/");
    div.innerHTML = `
      <span>
        <strong>${esc(c.title)}</strong>${c.disambiguation ? ` <span class="meta">(${esc(c.disambiguation)})</span>` : ""}
        <div class="meta">
          ${esc(c.artistCredit || "")}${types ? ` · ${esc(types)}` : ""}${c.firstReleaseDate ? ` · ${esc(c.firstReleaseDate)}` : ""} · score ${c.score}
          · <a href="https://musicbrainz.org/release-group/${esc(c.mbid)}" target="_blank" rel="noopener">view on MusicBrainz ↗</a>
        </div>
      </span>
      <button data-role="mb-assign">Assign</button>
    `;
    div.querySelector("[data-role='mb-assign']").addEventListener("click", () => assignMbid(panelTd, row, c.mbid));
    resultsEl.appendChild(div);
  }
}

// -- Manual MBID ---------------------------------------------------------

function wireManualAssign(panelTd, row) {
  panelTd.querySelector("[data-role='manual-assign']").addEventListener("click", () => {
    const mbid = panelTd.querySelector("[data-role='manual-mbid']").value.trim();
    if (!mbid) { setStatus(panelTd, "Enter an mbid first.", "error"); return; }
    assignMbid(panelTd, row, mbid);
  });
}

async function assignMbid(panelTd, row, mbid) {
  setStatus(panelTd, "Assigning…");
  const res = await fetch("/api/albums/assign-mbid", {
    method: "POST",
    body: JSON.stringify({ albumId: row.albumId, mbid }),
  });
  const data = await res.json();

  if (res.status === 409) {
    renderConflict(panelTd, row, data.conflictingAlbum, data.message);
    return;
  }
  if (!res.ok) {
    setStatus(panelTd, data.error || "Something went wrong.", "error");
    return;
  }

  logAction(`Assigned mbid to <span class="who">${esc(data.title)}</span>`);
  removeAlbumRow(row.albumId);
  loadQueue();
}

function renderConflict(panelTd, row, conflictingAlbum, message) {
  const slot = panelTd.querySelector("[data-role='merge-confirm-slot']");
  slot.innerHTML = "";
  const div = document.createElement("div");
  div.className = "conflict-banner";
  div.innerHTML = `
    <span>
      <div class="headline">${esc(message || "That mbid is already in use.")}</div>
      <div class="meta">Merge "${esc(row.title)}" into "${esc(conflictingAlbum.title)}"?</div>
    </span>
    <span>
      <button data-role="conflict-merge" class="primary">Merge</button>
      <button data-role="conflict-cancel">Cancel</button>
    </span>
  `;
  div.querySelector("[data-role='conflict-merge']").addEventListener("click", () =>
    mergeAlbums(panelTd, row, conflictingAlbum.albumId, conflictingAlbum.title));
  div.querySelector("[data-role='conflict-cancel']").addEventListener("click", () => { slot.innerHTML = ""; setStatus(panelTd, ""); });
  slot.appendChild(div);
  setStatus(panelTd, "");
}

// -- Merge search ---------------------------------------------------------

// Only one resolve panel is ever open at a time (togglePanel tears down
// the old one before building a new one), so this tracks a single
// document-level dismiss handler rather than piling up a fresh listener
// every time a panel opens.
let dismissMergeResultsHandler = null;

function wireMergeSearch(panelTd, row) {
  const input = panelTd.querySelector("[data-role='merge-query']");
  const resultsEl = panelTd.querySelector("[data-role='merge-results']");
  let debounceTimer = null;

  input.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    const q = input.value.trim();
    if (!q) { resultsEl.hidden = true; resultsEl.innerHTML = ""; return; }
    debounceTimer = setTimeout(() => runMergeSearch(q, resultsEl, panelTd, row), 200);
  });

  if (dismissMergeResultsHandler) document.removeEventListener("click", dismissMergeResultsHandler);
  dismissMergeResultsHandler = (e) => {
    if (!panelTd.contains(e.target)) return;
    if (e.target !== input) resultsEl.hidden = true;
  };
  document.addEventListener("click", dismissMergeResultsHandler);
}

async function runMergeSearch(query, resultsEl, panelTd, row) {
  const res = await fetch(`/api/albums/local-search?q=${encodeURIComponent(query)}&excludeId=${row.albumId}`);
  const data = await res.json();
  if (!res.ok || !data.results.length) {
    resultsEl.innerHTML = `<div class="search-result-row"><span class="meta">No matches.</span></div>`;
    resultsEl.hidden = false;
    return;
  }
  resultsEl.innerHTML = "";
  for (const r of data.results) {
    const div = document.createElement("div");
    div.className = "search-result-row";
    div.innerHTML = `<span>${esc(r.label)}</span><span class="meta">match ${r.score}</span>`;
    div.addEventListener("click", () => {
      resultsEl.hidden = true;
      confirmMerge(panelTd, row, r.albumId, r.title);
    });
    resultsEl.appendChild(div);
  }
  resultsEl.hidden = false;
}

async function confirmMerge(panelTd, row, targetAlbumId, targetTitle) {
  const slot = panelTd.querySelector("[data-role='merge-confirm-slot']");
  slot.innerHTML = `<div class="status-line">Loading…</div>`;
  const res = await fetch(`/api/albums/detail?id=${targetAlbumId}`);
  const target = await res.json();

  slot.innerHTML = "";
  const div = document.createElement("div");
  div.className = "merge-confirm";
  div.innerHTML = `
    <span>
      <strong>${esc(row.title)}</strong> (${row.scrobbleCount.toLocaleString()} scrobbles, ${row.vinylCount.toLocaleString()} vinyl)
      → merged into →
      <strong>${esc(target.title)}</strong> (${(target.scrobbleCount || 0).toLocaleString()} scrobbles, ${(target.vinylCount || 0).toLocaleString()} vinyl)
      <div class="meta">Cannot be undone from here — a backup is kept automatically.</div>
    </span>
    <span>
      <button data-role="do-merge" class="danger">Merge</button>
      <button data-role="cancel-merge">Cancel</button>
    </span>
  `;
  div.querySelector("[data-role='do-merge']").addEventListener("click", () => mergeAlbums(panelTd, row, targetAlbumId, target.title));
  div.querySelector("[data-role='cancel-merge']").addEventListener("click", () => { slot.innerHTML = ""; });
  slot.appendChild(div);
}

async function mergeAlbums(panelTd, row, canonicalId, canonicalTitle) {
  setStatus(panelTd, "Merging…");
  const res = await fetch("/api/albums/merge", {
    method: "POST",
    body: JSON.stringify({ absorbedId: row.albumId, canonicalId }),
  });
  const data = await res.json();
  if (!res.ok) {
    setStatus(panelTd, data.error || "Something went wrong.", "error");
    return;
  }

  const moved = Object.entries(data.rowsMoved)
    .filter(([k, v]) => v > 0 && !k.includes("collisions_dropped"))
    .map(([k, v]) => `${v} ${k.replace(/_/g, " ")}`)
    .join(", ");
  logAction(`Merged <span class="who">${esc(data.absorbedTitle)}</span> into <span class="who">${esc(canonicalTitle)}</span>${moved ? ` — moved ${esc(moved)}` : ""}`);
  removeAlbumRow(row.albumId);
  loadQueue();
}

// -- Wiring ---------------------------------------------------------------

refreshQueueBtn.addEventListener("click", loadQueue);
minCountInput.addEventListener("keydown", (e) => { if (e.key === "Enter") loadQueue(); });

buildBtn.addEventListener("click", async () => {
  buildBtn.disabled = true;
  logEl.innerHTML = "";
  document.getElementById("spinner").style.display = "";
  logStatusText.textContent = "Rebuilding public database…";
  logStatusText.style.color = "";
  logSection.style.display = "block";

  const res = await fetch("/build", { method: "POST" });
  const data = await res.json();
  if (!res.ok) {
    logStatusText.textContent = data.error || "Something went wrong.";
    buildBtn.disabled = false;
    return;
  }
  pollJob(data.jobId, logEl, (result) => {
    document.getElementById("spinner").style.display = "none";
    logStatusText.textContent = result.returncode === 0 ? "Done" : `Exited with code ${result.returncode}`;
    logStatusText.style.color = result.returncode === 0 ? "var(--accent-scrobble)" : "var(--accent-live)";
    buildBtn.disabled = false;
  });
});

loadQueue();
</script>
</body>
</html>
