<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-side topbar-left">
      <button class="icon-btn" onclick="location.hash='#/'" type="button" title="Home" aria-label="Home">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8" /><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" /></svg>
      </button>
    </div>
    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="Search artists…" autocomplete="off" />
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <div class="topbar-side topbar-right">
      <button id="theme-toggle" class="icon-btn" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>

  <main id="app">
    <div id="loading" class="loading-screen">
      <div class="loading-label">Loading your music database…</div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="progress-text" class="progress-text">Connecting…</div>
    </div>
  </main>

  <footer class="footer">
    <span id="footer-status"></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/enrichment.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
