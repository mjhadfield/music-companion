<head>

  <title>Music Companion</title>
  <script>
    // the theme before anything paints: your choice, else light (no dark flash for a first visit).
    // Inside Citadel's frame, Citadel sets it.
    try { if (window.self === window.top) document.documentElement.dataset.theme = localStorage.getItem("theme") || "light"; } catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>
  <script>
    // An old copy of this page from the browser's cache (an earlier version of the site) fetches
    // everything fresh and reloads -- once. Stamped by etl/bump_site_version.py, with the ?v= on
    // every stylesheet and script below; between versions everything caches as normal.
    const SITE_VERSION = "20261006-191820";
    fetch("version.txt", { cache: "no-store" }).then((r) => (r.ok ? r.text() : "")).then((v) => {
      v = v.trim();
      if (!v || v === SITE_VERSION) return;
      try { if (sessionStorage.getItem("site-refreshed") === v) return; sessionStorage.setItem("site-refreshed", v); } catch (e) { return; }
      return Promise.all([location.pathname || "./", "index.html"].map((u) => fetch(u, { cache: "reload" }).catch(() => null))).then(() => location.reload());
    }).catch(() => {});
  </script>

      <button id="hard-refresh" class="icon-btn topbar-reload" onclick="hardRefresh()" type="button" title="Reload everything — the newest version of the site and your data" aria-label="Reload everything"><svg class="i"><use href="#i-reload"/></svg></button>
      <button class="icon-btn topbar-home" onclick="location.hash='#/'" type="button" title="Home" aria-label="Home">

    </div>
  </header>
