<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Companion</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-side topbar-left">
      <button class="icon-btn" onclick="location.hash='#/'" type="button" title="Home" aria-label="Home">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8" /><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" /></svg>
      </button>
    </div>
    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="Search artists…" autocomplete="off" />
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <div class="topbar-side topbar-right">
      <a id="maintenance-link" class="icon-btn" href="http://192.168.0.66:8643/" title="Maintenance settings" aria-label="Maintenance settings"><svg class="i"><use href="#i-gear"/></svg></a>
      <button id="theme-toggle" class="icon-btn" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>

  <main id="app">
    <div id="loading" class="loading-screen">
      <div class="loading-label">Loading your music database…</div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="progress-text" class="progress-text">Connecting…</div>
    </div>
  </main>

  <footer class="footer">
    <span id="footer-status"></span>
  </footer>

  <nav class="tabbar" aria-label="Primary (mobile)" hidden>
    <a href="#/" data-route="home"><svg class="i"><use href="#i-home"/></svg>Home</a>
    <a href="#/vinyl" data-route="vinyl"><svg class="i"><use href="#i-disc"/></svg>Vinyl</a>
    <a href="#/shows" data-route="shows"><svg class="i"><use href="#i-bolt"/></svg>Live</a>
    <a href="#" data-route="search" id="tabbar-search"><svg class="i"><use href="#i-search"/></svg>Search</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/enrichment.js"></script>
  <script src="js/collection.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
